name: Daily Sponsorship Scraper

on:
  schedule:
    - cron: '0 8 * * *' # Runs daily at 8:00 AM UTC
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Python & uv
        uses: astral-sh/setup-uv@v2
        with:
          version: "latest"

      - name: Install Sponsorship Scout
        run: uv tool install ./sponsorship-scout

      - name: Generate Config
        run: |
          cat <<EOF > config.yaml
          profiles:
            - name: "Alice's Jobs"
              target_terms: ["software", "python", "backend"]
              target_locations: ["london", "remote"]
              industry_keywords: ["tech", "software"]
              destinations:
                - type: gist
                  gist_id: "${{ secrets.ALICE_GIST_ID }}"
                  github_token: "${{ secrets.GIST_TOKEN }}"
            
            - name: "Bob's Jobs"
              target_terms: ["data scientist", "machine learning"]
              target_locations: ["uk"]
              industry_keywords: ["data", "finance"]
              destinations:
                - type: gist
                  gist_id: "${{ secrets.BOB_GIST_ID }}"
                  github_token: "${{ secrets.GIST_TOKEN }}"
          EOF

      - name: Run Scraper
        run: sponsorship-scout run --config config.yaml
