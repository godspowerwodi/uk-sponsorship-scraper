[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sponsorship-scout"
version = "0.1.0"
description = "Multi-tenant UK Sponsorship Job Scraper"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "aiohttp>=3.9.0",
    "typer>=0.9.0",
    "pydantic>=2.0.0",
    "streamlit>=1.30.0",
    "pyyaml>=6.0",
    "pandas>=2.0.0",
    "schedule>=1.2.0",
    "beautifulsoup4>=4.12.0",
    "requests>=2.31.0"
]

[project.scripts]
sponsorship-scout = "sponsorship_scout.cli:app"

[tool.setuptools.packages.find]
where = ["src"]
